<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>খুলনা সার্কিট হাউস — 3D মডেল ও .GLB প্রিভিউ স্টুডিও</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: "Manrope", "Noto Sans Bengali", system-ui, sans-serif; color: #f8fafc; }
    #canvas-wrap { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 20;
      background: rgba(15, 23, 42, 0.86); backdrop-filter: blur(12px);
      border: 1px solid rgba(250, 204, 21, 0.38); border-radius: 14px;
      padding: 14px 16px; max-width: 350px; box-shadow: 0 12px 32px rgba(0,0,0,0.48);
    }
    #hud h1 { font-size: 16px; font-weight: 800; color: #facc15; margin-bottom: 4px; }
    #hud p { font-size: 12px; color: #cbd5e1; line-height: 1.45; margin-bottom: 10px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    button {
      cursor: pointer; border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(30, 41, 59, 0.9); color: #f8fafc;
      padding: 7px 9px; border-radius: 8px; font-size: 12px; font-weight: 600;
      transition: all 0.16s ease;
    }
    button:hover { background: rgba(51, 65, 85, 0.95); border-color: #facc15; }
    button.active { background: #ca8a04; color: #0f172a; border-color: #fde047; }
    button.primary {
      width: 100%; background: linear-gradient(135deg, #16a34a, #15803d);
      border-color: #4ade80; color: #ffffff; padding: 9px; font-size: 13px; margin-top: 4px;
    }
    button.primary:hover { filter: brightness(1.1); }
    #status { font-size: 11px; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="hud">
    <h1>খুলনা সার্কিট হাউস (3D মডেল)</h1>
    <p>মাউস ড্র্যাগ করে ৩৬০° ঘোরান, স্ক্রল করে জুম করুন, অথবা <b>W A S D</b> চেপে গেট ও ভবনের ভেতর হাঁটুন।</p>
    <div class="btn-grid">
      <button id="btn-gate" class="active">মেইন গেট (স্ট্রিট ভিউ)</button>
      <button id="btn-bldg">মূল ভবন ও পোর্টিকো</button>
      <button id="btn-full">পুরো কমপ্লেক্স</button>
      <button id="btn-hall">ভেতরের ভিআইপি হল</button>
      <button id="btn-memorial">একাত্তরের স্মৃতিফলক</button>
      <button id="btn-cut">কাটঅ্যাওয়ে (ভেতর)</button>
      <button id="btn-night">দিন / রাত</button>
      <button id="btn-reset">রিসেট ভিউ</button>
    </div>
    <button id="btn-glb" class="primary">ডাউনলোড .GLB মডেল (khulna_circuit_house.glb)</button>
    <div id="status">লোড সম্পন্ন · ৬০ FPS রেডি</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { buildKhulnaCircuitHouseStandalone3D } from './src/circuit-house-standalone.js';

    const wrap = document.getElementById('canvas-wrap');
    const statusEl = document.getElementById('status');

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ec5e8);
    scene.fog = new THREE.FogExp2(0x9ec5e8, 0.0038);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.15, 320);
    // Start at the exact Street View angle of the Khulna Circuit House Main Gate!
    camera.position.set(-10.5, 3.2, 31.5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.target.set(1.2, 2.8, 16.5);

    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x3b4a36, 0.98);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff6e5, 2.25);
    sunLight.position.set(28, 42, 36);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -42;
    sunLight.shadow.camera.right = 42;
    sunLight.shadow.camera.top = 42;
    sunLight.shadow.camera.bottom = -42;
    scene.add(sunLight);

    const gateLight = new THREE.PointLight(0xffe7b3, 12, 22, 1.5);
    gateLight.position.set(1.5, 4.6, 18.2);
    scene.add(gateLight);

    const hallLight = new THREE.PointLight(0xfff1cc, 16, 24, 1.5);
    hallLight.position.set(0, 4.2, -13.0);
    scene.add(hallLight);

    const circuitHouse = buildKhulnaCircuitHouseStandalone3D();
    scene.add(circuitHouse.root);

    const presets = {
      gate:     { pos: [-10.5, 3.2, 31.5], target: [1.2, 2.8, 16.5], cut: false },
      bldg:     { pos: [-16.5, 5.2, 13.5], target: [0.0, 3.4, -10.5], cut: false },
      full:     { pos: [-26.0, 18.0, 36.0], target: [0.0, 3.0, 3.0], cut: false },
      hall:     { pos: [0.0, 2.4, -5.5], target: [0.0, 2.2, -14.5], cut: false },
      memorial: { pos: [-11.8, 2.2, 24.5], target: [-9.8, 1.5, 18.4], cut: false },
    };

    let cutaway = false;
    let isNight = false;

    function setActiveBtn(id) {
      for (const el of document.querySelectorAll('#hud button')) el.classList.remove('active');
      const b = document.getElementById(id);
      if (b) b.classList.add('active');
    }

    function goPreset(key, btnId) {
      const p = presets[key];
      if (!p) return;
      cutaway = p.cut;
      circuitHouse.setCutaway(cutaway);
      camera.position.set(...p.pos);
      controls.target.set(...p.target);
      controls.update();
      setActiveBtn(btnId);
    }

    document.getElementById('btn-gate').onclick = () => goPreset('gate', 'btn-gate');
    document.getElementById('btn-reset').onclick = () => goPreset('gate', 'btn-gate');
    document.getElementById('btn-bldg').onclick = () => goPreset('bldg', 'btn-bldg');
    document.getElementById('btn-full').onclick = () => goPreset('full', 'btn-full');
    document.getElementById('btn-hall').onclick = () => goPreset('hall', 'btn-hall');
    document.getElementById('btn-memorial').onclick = () => goPreset('memorial', 'btn-memorial');
    document.getElementById('btn-cut').onclick = () => {
      cutaway = !cutaway;
      circuitHouse.setCutaway(cutaway);
      if (cutaway) {
        camera.position.set(12.0, 12.5, 2.5);
        controls.target.set(0, 2.2, -12.0);
        setActiveBtn('btn-cut');
      } else {
        setActiveBtn('btn-bldg');
      }
    };
    document.getElementById('btn-night').onclick = () => {
      isNight = !isNight;
      const bg = isNight ? 0x090f1d : 0x9ec5e8;
      scene.background.setHex(bg);
      scene.fog.color.setHex(bg);
      sunLight.intensity = isNight ? 0.24 : 2.25;
      hemiLight.intensity = isNight ? 0.28 : 0.98;
      gateLight.intensity = isNight ? 28 : 12;
      hallLight.intensity = isNight ? 28 : 16;
      renderer.toneMappingExposure = isNight ? 1.24 : 1.12;
    };

    document.getElementById('btn-glb').onclick = () => {
      statusEl.textContent = 'GLB এক্সপোর্ট হচ্ছে...';
      const prevCut = cutaway;
      circuitHouse.setCutaway(false);
      const exporter = new GLTFExporter();
      exporter.parse(
        circuitHouse.root,
        (result) => {
          circuitHouse.setCutaway(prevCut);
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'khulna_circuit_house.glb';
          a.click();
          URL.revokeObjectURL(url);
          statusEl.textContent = 'khulna_circuit_house.glb ডাউনলোড হয়েছে!';
        },
        (err) => {
          circuitHouse.setCutaway(prevCut);
          statusEl.textContent = 'এক্সপোর্ট এরর: ' + err.message;
        },
        { binary: true },
      );
    };

    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    const fwd = new THREE.Vector3();
    const right = new THREE.Vector3();
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());
      circuitHouse.update(clock.elapsedTime);

      const speed = (keys.ShiftLeft || keys.ShiftRight ? 12 : 5.2) * dt;
      camera.getWorldDirection(fwd);
      fwd.y = 0;
      fwd.normalize();
      right.crossVectors(fwd, camera.up).normalize();

      const move = new THREE.Vector3();
      if (keys.KeyW || keys.ArrowUp) move.add(fwd);
      if (keys.KeyS || keys.ArrowDown) move.sub(fwd);
      if (keys.KeyD || keys.ArrowRight) move.add(right);
      if (keys.KeyA || keys.ArrowLeft) move.sub(right);
      if (keys.KeyE) move.y += 1;
      if (keys.KeyQ) move.y -= 1;
      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(speed);
        camera.position.add(move);
        controls.target.add(move);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
