<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>খুলনা সার্কিট হাউস — ফটোরিয়ালিস্টিক 3D ও .GLB প্রিভিউ স্টুডিও</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: "Manrope", "Noto Sans Bengali", system-ui, sans-serif; color: #f8fafc; }
    #canvas-wrap { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 20;
      background: rgba(15, 23, 42, 0.86); backdrop-filter: blur(12px);
      border: 1px solid rgba(250, 204, 21, 0.38); border-radius: 14px;
      padding: 14px 16px; max-width: 356px; box-shadow: 0 12px 32px rgba(0,0,0,0.48);
    }
    #hud h1 { font-size: 16px; font-weight: 800; color: #facc15; margin-bottom: 4px; }
    #hud p { font-size: 12px; color: #cbd5e1; line-height: 1.45; margin-bottom: 10px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    button {
      cursor: pointer; border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(30, 41, 59, 0.9); color: #f8fafc;
      padding: 7px 9px; border-radius: 8px; font-size: 12px; font-weight: 600;
      transition: all 0.16s ease;
    }
    button:hover { background: rgba(51, 65, 85, 0.95); border-color: #facc15; }
    button.active { background: #ca8a04; color: #0f172a; border-color: #fde047; }
    button.primary {
      width: 100%; background: linear-gradient(135deg, #16a34a, #15803d);
      border-color: #4ade80; color: #ffffff; padding: 9px; font-size: 13px; margin-top: 4px;
    }
    button.primary:hover { filter: brightness(1.1); }
    #status { font-size: 11px; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="hud">
    <h1>খুলনা সার্কিট হাউস (ফটোরিয়ালিস্টিক 3D)</h1>
    <p>মাউস ড্র্যাগ করে ৩৬০° ঘোরান, স্ক্রল করে জুম করুন, অথবা <b>W A S D</b> চেপে বাম দিকের রাস্তা দিয়ে ভেতরে হাঁটুন।</p>
    <div class="btn-grid">
      <button id="btn-gate" class="active">মেইন গেট (স্ট্রিট ভিউ)</button>
      <button id="btn-driveway">বাম দিকের প্রবেশপথ</button>
      <button id="btn-bldg">মূল ভবন ও পোর্টিকো</button>
      <button id="btn-full">পুরো কমপ্লেক্স</button>
      <button id="btn-hall">ভেতরের ভিআইপি হল</button>
      <button id="btn-memorial">একাত্তরের স্মৃতিফলক</button>
      <button id="btn-cut">কাটঅ্যাওয়ে (ভেতর)</button>
      <button id="btn-time">সময়: দুপুর (DAYLIGHT)</button>
    </div>
    <button id="btn-glb" class="primary">ডাউনলোড .GLB মডেল (khulna_circuit_house.glb)</button>
    <div id="status">PBR নরমাল ম্যাপ + HDRI স্কাই লোড সম্পন্ন</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { createAtmosphericSkyAndPMREM } from './src/aaa-shaders.js';
    import { buildKhulnaCircuitHouseStandalone3D } from './src/circuit-house-standalone.js';

    const wrap = document.getElementById('canvas-wrap');
    const statusEl = document.getElementById('status');

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xcfe0ea, 0.0024);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.15, 420);
    // Exact Street View perspective looking at Khulna Circuit House Main Gate on K.D. Ghos Rd!
    camera.position.set(-1.5, 2.75, 31.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.target.set(10.8, 2.7, 17.5);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.28);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xb6daf7, 0x5d6554, 1.05);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e4, 2.45);
    sunLight.position.set(36, 48, 38);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.bias = -0.0004;
    sunLight.shadow.normalBias = 0.025;
    sunLight.shadow.camera.left = -52;
    sunLight.shadow.camera.right = 52;
    sunLight.shadow.camera.top = 52;
    sunLight.shadow.camera.bottom = -52;
    scene.add(sunLight);

    // Volumetric Cloud Sky Dome + Baked PMREM HDRI Environment Reflections!
    const skySystem = createAtmosphericSkyAndPMREM(scene, renderer);
    skySystem.applyPreset('daylight', { sun: sunLight, hemisphereLight: hemiLight, ambientLight, quality: 'ultra' });

    const gateLight = new THREE.PointLight(0xffe7b3, 10, 22, 1.5);
    gateLight.position.set(11.5, 4.6, 18.2);
    scene.add(gateLight);

    const hallLight = new THREE.PointLight(0xfff1cc, 14, 24, 1.5);
    hallLight.position.set(-8.5, 4.2, -12.0);
    scene.add(hallLight);

    const circuitHouse = buildKhulnaCircuitHouseStandalone3D();
    scene.add(circuitHouse.root);

    // Load Real High-Detail 3D Tropical Trees (krishnachura_tree.glb) instead of blocky low-poly balls!
    const treeLoader = new GLTFLoader();
    treeLoader.load('./assets/krishnachura_tree.glb', (gltf) => {
      const tmpl = gltf.scene;
      tmpl.updateMatrixWorld(true);
      const box3 = new THREE.Box3().setFromObject(tmpl);
      const sz = new THREE.Vector3();
      box3.getSize(sz);
      const baseH = Math.max(0.1, sz.y);

      tmpl.traverse((child) => {
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = true;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        for (const mat of mats) {
          if (!mat) continue;
          if (child.name.includes('Foliage') || mat.transparent || mat.alphaMap) {
            mat.transparent = false;
            mat.alphaTest = 0.32;
            mat.side = THREE.DoubleSide;
            mat.depthWrite = true;
            mat.roughness = 0.72;
          }
          mat.needsUpdate = true;
        }
      });

      for (const spot of circuitHouse.treeSpots) {
        const tree = tmpl.clone(true);
        const sc = spot.h / baseH;
        tree.scale.setScalar(sc);
        tree.rotation.y = spot.rotY;
        tree.position.set(spot.x, -box3.min.y * sc, spot.z);
        circuitHouse.root.add(tree);
      }
      statusEl.textContent = 'PBR ইট/কংক্রিট + রিয়েল 3D গাছ লোড সম্পন্ন · ৬০ FPS';
    });

    const presets = {
      gate:     { pos: [-1.5, 2.75, 31.2], target: [10.8, 2.7, 17.5], cut: false },
      driveway: { pos: [12.5, 4.2, 23.5],  target: [-2.0, 2.2, 4.5],  cut: false },
      bldg:     { pos: [-24.5, 5.2, 13.5], target: [-8.5, 3.2, -9.5], cut: false },
      full:     { pos: [-16.0, 22.0, 42.0], target: [0.0, 2.5, 4.0],  cut: false },
      hall:     { pos: [-8.5, 2.4, -4.5],  target: [-8.5, 2.2, -13.5], cut: false },
      memorial: { pos: [-2.5, 2.1, 24.5],  target: [0.1, 1.6, 18.4],  cut: false },
    };

    const timeModes = [
      { id: 'daylight', label: 'সময়: দুপুর (DAYLIGHT)', gateI: 10, hallI: 14 },
      { id: 'golden',   label: 'সময়: বিকেল (GOLDEN)',   gateI: 16, hallI: 18 },
      { id: 'sunset',   label: 'সময়: সন্ধ্যা (SUNSET)',  gateI: 24, hallI: 24 },
      { id: 'night',    label: 'সময়: রাত (NIGHT)',       gateI: 32, hallI: 30 },
    ];
    let timeIdx = 0;
    let cutaway = false;

    function setActiveBtn(id) {
      for (const el of document.querySelectorAll('#hud button')) el.classList.remove('active');
      const b = document.getElementById(id);
      if (b) b.classList.add('active');
    }

    function goPreset(key, btnId) {
      const p = presets[key];
      if (!p) return;
      cutaway = p.cut;
      circuitHouse.setCutaway(cutaway);
      camera.position.set(...p.pos);
      controls.target.set(...p.target);
      controls.update();
      setActiveBtn(btnId);
    }

    document.getElementById('btn-gate').onclick = () => goPreset('gate', 'btn-gate');
    document.getElementById('btn-driveway').onclick = () => goPreset('driveway', 'btn-driveway');
    document.getElementById('btn-bldg').onclick = () => goPreset('bldg', 'btn-bldg');
    document.getElementById('btn-full').onclick = () => goPreset('full', 'btn-full');
    document.getElementById('btn-hall').onclick = () => goPreset('hall', 'btn-hall');
    document.getElementById('btn-memorial').onclick = () => goPreset('memorial', 'btn-memorial');
    document.getElementById('btn-cut').onclick = () => {
      cutaway = !cutaway;
      circuitHouse.setCutaway(cutaway);
      if (cutaway) {
        camera.position.set(4.5, 13.5, 3.5);
        controls.target.set(-8.5, 2.2, -11.0);
        setActiveBtn('btn-cut');
      } else {
        setActiveBtn('btn-bldg');
      }
    };
    const timeBtn = document.getElementById('btn-time');
    timeBtn.onclick = () => {
      timeIdx = (timeIdx + 1) % timeModes.length;
      const mode = timeModes[timeIdx];
      skySystem.applyPreset(mode.id, { sun: sunLight, hemisphereLight: hemiLight, ambientLight, quality: 'ultra' });
      gateLight.intensity = mode.gateI;
      hallLight.intensity = mode.hallI;
      timeBtn.textContent = mode.label;
    };

    document.getElementById('btn-glb').onclick = () => {
      statusEl.textContent = 'GLB এক্সপোর্ট হচ্ছে...';
      const prevCut = cutaway;
      circuitHouse.setCutaway(false);
      const exporter = new GLTFExporter();
      exporter.parse(
        circuitHouse.root,
        (result) => {
          circuitHouse.setCutaway(prevCut);
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'khulna_circuit_house.glb';
          a.click();
          URL.revokeObjectURL(url);
          statusEl.textContent = 'khulna_circuit_house.glb ডাউনলোড হয়েছে!';
        },
        (err) => {
          circuitHouse.setCutaway(prevCut);
          statusEl.textContent = 'এক্সপোর্ট এরর: ' + err.message;
        },
        { binary: true },
      );
    };

    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    const fwd = new THREE.Vector3();
    const right = new THREE.Vector3();
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());
      circuitHouse.update(clock.elapsedTime);
      skySystem.update(clock.elapsedTime, camera.position);

      const speed = (keys.ShiftLeft || keys.ShiftRight ? 12 : 5.2) * dt;
      camera.getWorldDirection(fwd);
      fwd.y = 0;
      fwd.normalize();
      right.crossVectors(fwd, camera.up).normalize();

      const move = new THREE.Vector3();
      if (keys.KeyW || keys.ArrowUp) move.add(fwd);
      if (keys.KeyS || keys.ArrowDown) move.sub(fwd);
      if (keys.KeyD || keys.ArrowRight) move.add(right);
      if (keys.KeyA || keys.ArrowLeft) move.sub(right);
      if (keys.KeyE) move.y += 1;
      if (keys.KeyQ) move.y -= 1;
      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(speed);
        camera.position.add(move);
        controls.target.add(move);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
