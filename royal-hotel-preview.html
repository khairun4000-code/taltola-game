<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Royal International Khulna — Photorealistic 3D Model Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: "Manrope", "Noto Sans Bengali", system-ui, sans-serif; color: #f8fafc; }
    #canvas-wrap { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 20;
      background: rgba(15, 23, 42, 0.86); backdrop-filter: blur(14px);
      border: 1px solid rgba(250, 204, 21, 0.38); border-radius: 14px;
      padding: 14px 16px; max-width: 355px; box-shadow: 0 12px 34px rgba(0,0,0,0.48);
    }
    #hud h1 { font-size: 16px; font-weight: 800; color: #facc15; margin-bottom: 4px; }
    #hud p { font-size: 12px; color: #cbd5e1; line-height: 1.45; margin-bottom: 10px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    button {
      cursor: pointer; border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(30, 41, 59, 0.9); color: #f8fafc;
      padding: 7px 8px; border-radius: 8px; font-size: 11.5px; font-weight: 600;
      transition: all 0.16s ease;
    }
    button:hover { background: rgba(51, 65, 85, 0.95); border-color: #facc15; }
    button.active { background: #ca8a04; color: #0f172a; border-color: #fde047; }
    button.primary {
      width: 100%; background: linear-gradient(135deg, #16a34a, #15803d);
      border-color: #4ade80; color: #ffffff; padding: 9px; font-size: 13px; margin-top: 4px;
    }
    button.primary:hover { filter: brightness(1.1); }
    #status { font-size: 11px; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="hud">
    <h1>হোটেল রয়্যাল ইন্টারন্যাশনাল (ফটোরিয়ালিস্টিক 3D)</h1>
    <p>মাউস ড্র্যাগ করে ঘোরান, স্ক্রল করে জুম করুন, অথবা <b>W A S D / Q E</b> চেপে পোডিয়াম ও ১০ তলা টাওয়ারের ভেতরে হাঁটুন।</p>
    <div class="btn-grid">
      <button id="btn-ext" class="active">বাইরের ভিউ</button>
      <button id="btn-lobby">রিসেপশন লবি</button>
      <button id="btn-banquet">ব্যাংকুয়েট (টাওয়ার ১ম)</button>
      <button id="btn-rest">স্যাফায়ার রেস্টুরেন্ট</button>
      <button id="btn-room">রুম ৩০৩ (পোডিয়াম)</button>
      <button id="btn-pres">প্রেসিডেন্সিয়াল (৬ষ্ঠ)</button>
      <button id="btn-sky">স্কাই লাউঞ্জ (১০ম তলা)</button>
      <button id="btn-cut">কাটঅ্যাওয়ে (ভেতর)</button>
      <button id="btn-tod">আলো: গোল্ডেন আওয়ার</button>
      <button id="btn-reset">রিসেট ভিউ</button>
    </div>
    <button id="btn-glb" class="primary">ডাউনলোড .GLB মডেল</button>
    <div id="status">লোড সম্পন্ন · PBR + IBL রিফ্লেকশন চালু</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { createAtmosphericSkyAndPMREM } from './src/aaa-shaders.js';
    import { buildHotelRoyalStandalone3D } from './src/hotel-royal-standalone.js';

    const wrap = document.getElementById('canvas-wrap');
    const statusEl = document.getElementById('status');

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xdccbb6, 0.0028);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.15, 360);
    camera.position.set(28, 16, 36);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.target.set(-2, 11.0, -3);

    // Photorealistic Atmospheric Sky Dome + Baked HDR PMREM Environment Reflections
    const skySystem = createAtmosphericSkyAndPMREM(scene, renderer);

    const hemiLight = new THREE.HemisphereLight(0x9ec8f2, 0x5c4f3d, 1.02);
    scene.add(hemiLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.22);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffd199, 2.5);
    sunLight.position.set(36, 46, 34);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 140;
    sunLight.shadow.camera.left = -42;
    sunLight.shadow.camera.right = 42;
    sunLight.shadow.camera.top = 45;
    sunLight.shadow.camera.bottom = -38;
    sunLight.shadow.bias = -0.0004;
    sunLight.shadow.normalBias = 0.025;
    scene.add(sunLight);

    // Warm Interior Architectural Lighting across BOTH Podium & 10-Story Rear Tower
    const interiorLights = [
      // Podium Ground, 2nd & 3rd
      [0, 3.2, 4.5, 0xfff3d6, 16, 22],
      [-7.5, 3.2, -2.5, 0xffe8b8, 13, 16],
      [7.5, 3.2, 2.0, 0xffe8b8, 13, 16],
      [0, 7.0, 4.0, 0xfff0cc, 16, 22],
      [0, 10.8, 4.8, 0xfff3d6, 14, 16],
      // 10-Story Rear Tower Interiors (Banquet, VIP Dining, 4th, 6th Presidential Suite, 10th Sky Lounge)
      [-4.2, 3.2, -16.8, 0xffeec8, 18, 24],
      [-4.2, 7.0, -16.8, 0xffeec8, 15, 22],
      [-4.2, 14.2, -14.2, 0xfff2d2, 14, 18],
      [-6.5, 21.1, -14.8, 0xfff0cc, 18, 22],
      [0.8, 21.1, -14.2, 0xffe8b8, 14, 18],
      [-5.2, 34.7, -15.5, 0xffe9be, 18, 24],
    ];
    for (const [x, y, z, col, intensity, dist] of interiorLights) {
      const pl = new THREE.PointLight(col, intensity, dist, 1.5);
      pl.position.set(x, y, z);
      scene.add(pl);
    }

    const hotel = buildHotelRoyalStandalone3D();
    scene.add(hotel.root);

    // Time-of-day cycling (Golden Hour -> Midday -> Sunset -> Night)
    const todOrder = [
      { id: 'golden', label: 'আলো: গোল্ডেন আওয়ার', sunPos: [36, 42, 34] },
      { id: 'daylight', label: 'আলো: দুপুর', sunPos: [28, 62, 26] },
      { id: 'sunset', label: 'আলো: সন্ধ্যা', sunPos: [48, 18, 26] },
      { id: 'night', label: 'আলো: রাত', sunPos: [-26, 44, 28] },
    ];
    let todIdx = 0;
    function applyTimeOfDay(idx) {
      todIdx = idx % todOrder.length;
      const item = todOrder[todIdx];
      sunLight.position.set(...item.sunPos);
      skySystem.applyPreset(item.id, {
        sun: sunLight,
        hemisphereLight: hemiLight,
        ambientLight,
        quality: 'ultra',
      });
      document.getElementById('btn-tod').textContent = item.label;
    }
    applyTimeOfDay(0);

    // Camera Presets for BOTH 3-Story Podium & Walkable 10-Story Rear Tower
    const presets = {
      ext: { pos: [28, 16, 36], target: [-2, 11.0, -3], cut: false },
      lobby: { pos: [0, 1.9, 10.6], target: [-2.5, 1.8, -3.5], cut: false },
      banquet: { pos: [-9.6, 2.0, -11.4], target: [-2.2, 1.8, -17.2], cut: false },
      rest: { pos: [-7.5, 5.8, 8.2], target: [5.5, 5.4, 1.2], cut: false },
      room: { pos: [0.0, 9.6, 0.8], target: [-0.2, 9.2, 6.5], cut: false },
      pres: { pos: [-11.4, 20.1, -13.2], target: [-2.0, 19.7, -14.8], cut: false },
      sky: { pos: [-11.8, 33.7, -11.5], target: [-1.5, 33.3, -19.5], cut: false },
    };

    let cutaway = false;

    function setActiveBtn(id) {
      for (const el of document.querySelectorAll('#hud button')) el.classList.remove('active');
      const b = document.getElementById(id);
      if (b) b.classList.add('active');
    }

    function goPreset(key, btnId) {
      const p = presets[key];
      if (!p) return;
      cutaway = p.cut;
      hotel.setCutaway(cutaway);
      camera.position.set(...p.pos);
      controls.target.set(...p.target);
      controls.update();
      setActiveBtn(btnId);
    }

    document.getElementById('btn-ext').onclick = () => goPreset('ext', 'btn-ext');
    document.getElementById('btn-reset').onclick = () => goPreset('ext', 'btn-ext');
    document.getElementById('btn-lobby').onclick = () => goPreset('lobby', 'btn-lobby');
    document.getElementById('btn-banquet').onclick = () => goPreset('banquet', 'btn-banquet');
    document.getElementById('btn-rest').onclick = () => goPreset('rest', 'btn-rest');
    document.getElementById('btn-room').onclick = () => goPreset('room', 'btn-room');
    document.getElementById('btn-pres').onclick = () => goPreset('pres', 'btn-pres');
    document.getElementById('btn-sky').onclick = () => goPreset('sky', 'btn-sky');
    document.getElementById('btn-cut').onclick = () => {
      cutaway = !cutaway;
      hotel.setCutaway(cutaway);
      if (cutaway) {
        camera.position.set(24, 20, 26);
        controls.target.set(-4, 12.0, -8);
        setActiveBtn('btn-cut');
      } else {
        setActiveBtn('btn-ext');
      }
    };
    document.getElementById('btn-tod').onclick = () => applyTimeOfDay(todIdx + 1);

    // One-Click .GLB Export
    document.getElementById('btn-glb').onclick = () => {
      statusEl.textContent = 'GLB এক্সপোর্ট হচ্ছে...';
      const prevCut = cutaway;
      hotel.setCutaway(false);
      const exporter = new GLTFExporter();
      exporter.parse(
        hotel.root,
        (result) => {
          hotel.setCutaway(prevCut);
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'hotel_royal_international_khulna.glb';
          a.click();
          URL.revokeObjectURL(url);
          statusEl.textContent = 'hotel_royal_international_khulna.glb ডাউনলোড হয়েছে!';
        },
        (err) => {
          hotel.setCutaway(prevCut);
          statusEl.textContent = 'এক্সপোর্ট এরর: ' + err.message;
        },
        { binary: true },
      );
    };

    // Smooth WASD + Q/E Free-Walk Movement inside Podium & 10-Story Tower
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    const fwd = new THREE.Vector3();
    const right = new THREE.Vector3();
    const clock = new THREE.Clock();
    let elapsed = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());
      elapsed += dt;
      const speed = (keys.ShiftLeft || keys.ShiftRight ? 11 : 4.8) * dt;
      camera.getWorldDirection(fwd);
      fwd.y = 0;
      fwd.normalize();
      right.crossVectors(fwd, camera.up).normalize();

      const move = new THREE.Vector3();
      if (keys.KeyW || keys.ArrowUp) move.add(fwd);
      if (keys.KeyS || keys.ArrowDown) move.sub(fwd);
      if (keys.KeyD || keys.ArrowRight) move.add(right);
      if (keys.KeyA || keys.ArrowLeft) move.sub(right);
      if (keys.KeyE) move.y += 1;
      if (keys.KeyQ) move.y -= 1;
      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(speed);
        camera.position.add(move);
        controls.target.add(move);
      }
      controls.update();
      skySystem.update(elapsed, camera.position);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
