<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toyota Prius 2012 — Game-Ready 3D Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #0d1219; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #eef2f7; }
    #canvas-wrap { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 16px; left: 16px; width: 295px;
      background: rgba(12, 18, 28, 0.86); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px;
      padding: 16px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      max-height: calc(100vh - 32px); overflow-y: auto;
    }
    h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; margin-bottom: 4px; color: #fff; }
    .sub { font-size: 11.5px; color: #94a3b8; margin-bottom: 14px; }
    .sec { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px; color: #64748b; margin: 12px 0 6px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 6px; }
    button {
      background: rgba(255, 255, 255, 0.07); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px; padding: 7px 9px; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: rgba(56, 189, 248, 0.18); border-color: rgba(56, 189, 248, 0.45); }
    button.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .slider-row { margin-top: 8px; }
    .slider-row label { display: flex; justify-content: space-between; font-size: 11.5px; color: #cbd5e1; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; }
    #status { margin-top: 12px; font-size: 11px; color: #38bdf8; min-height: 16px; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="hud">
    <h1>Toyota Prius 2012 (Game-Ready)</h1>
    <div class="sub">Workable 4 Doors · Spinning &amp; Steering Wheels · Steering Wheel</div>

    <div class="sec">Doors (দরজা)</div>
    <div class="grid-1" style="margin-bottom:6px">
      <button id="btn-all-doors">Open / Close All 4 Doors</button>
    </div>
    <div class="grid">
      <button id="btn-dfl">Front Left (FL)</button>
      <button id="btn-dfr">Front Right (FR)</button>
      <button id="btn-drl">Rear Left (RL)</button>
      <button id="btn-drr">Rear Right (RR)</button>
    </div>

    <div class="sec">Wheels &amp; Steering (চাকা ও স্টিয়ারিং)</div>
    <div class="grid-1">
      <button id="btn-spin" class="active">Wheels Spin: ON</button>
    </div>
    <div class="slider-row">
      <label><span>Wheel Speed</span><span id="lbl-speed">1.0x</span></label>
      <input id="rng-speed" type="range" min="0" max="3" step="0.1" value="1.0" />
    </div>
    <div class="slider-row">
      <label><span>Front Steer &amp; Steering Wheel</span><span id="lbl-steer">0°</span></label>
      <input id="rng-steer" type="range" min="-32" max="32" step="1" value="0" />
    </div>

    <div class="sec">Camera Views</div>
    <div class="grid">
      <button id="cam-ext">3/4 Exterior</button>
      <button id="cam-side">Side Doors</button>
      <button id="cam-wheel">Wheel Close-Up</button>
      <button id="cam-int">Interior</button>
    </div>

    <div id="status">Loading toyota_prius_game_ready.glb...</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const wrap = document.getElementById('canvas-wrap');
    const statusEl = document.getElementById('status');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111722);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(-4.0, 1.85, -4.4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.78, 0);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.4);
    dirLight.position.set(-5, 9, -6);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    scene.add(dirLight);
    scene.add(new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 0.85));

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(14, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a2230, roughness: 0.72, metalness: 0.15 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const grid = new THREE.GridHelper(16, 32, 0x334155, 0x1e293b);
    grid.position.y = 0.002;
    scene.add(grid);

    const doorState = {
      Door_FL: { node: null, open: false, cur: 0, dir: -1 },
      Door_FR: { node: null, open: false, cur: 0, dir:  1 },
      Door_RL: { node: null, open: false, cur: 0, dir: -1 },
      Door_RR: { node: null, open: false, cur: 0, dir:  1 },
    };
    const parts = { wFL: null, wFR: null, wRL: null, wRR: null, sFL: null, sFR: null, sw: null };
    let spinOn = true;
    let spinSpeed = 1.0;
    let steerRad = 0;

    const loader = new GLTFLoader();
    loader.load('./assets/toyota_prius_game_ready.glb?v=3', (gltf) => {
      const car = gltf.scene;
      car.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      scene.add(car);

      for (const k of Object.keys(doorState)) doorState[k].node = car.getObjectByName(k);
      parts.wFL = car.getObjectByName('Wheel_FL');
      parts.wFR = car.getObjectByName('Wheel_FR');
      parts.wRL = car.getObjectByName('Wheel_RL');
      parts.wRR = car.getObjectByName('Wheel_RR');
      parts.sFL = car.getObjectByName('Wheel_FL_Steer');
      parts.sFR = car.getObjectByName('Wheel_FR_Steer');
      parts.sw  = car.getObjectByName('Steering_Wheel');

      statusEl.textContent = 'Loaded cleanly — test all 4 doors & wheels!';
    }, undefined, (err) => {
      statusEl.textContent = 'Load error: ' + err.message;
    });

    function syncDoorButtons() {
      const map = { 'btn-dfl': 'Door_FL', 'btn-dfr': 'Door_FR', 'btn-drl': 'Door_RL', 'btn-drr': 'Door_RR' };
      let anyOpen = false;
      for (const [id, key] of Object.entries(map)) {
        const on = doorState[key].open;
        if (on) anyOpen = true;
        document.getElementById(id).classList.toggle('active', on);
      }
      document.getElementById('btn-all-doors').classList.toggle('active', anyOpen);
    }

    document.getElementById('btn-all-doors').onclick = () => {
      const next = !Object.values(doorState).some((d) => d.open);
      for (const d of Object.values(doorState)) d.open = next;
      syncDoorButtons();
    };
    for (const [id, key] of [['btn-dfl','Door_FL'],['btn-dfr','Door_FR'],['btn-drl','Door_RL'],['btn-drr','Door_RR']]) {
      document.getElementById(id).onclick = () => {
        doorState[key].open = !doorState[key].open;
        syncDoorButtons();
      };
    }

    document.getElementById('btn-spin').onclick = (e) => {
      spinOn = !spinOn;
      e.target.classList.toggle('active', spinOn);
      e.target.textContent = `Wheels Spin: ${spinOn ? 'ON' : 'OFF'}`;
    };
    document.getElementById('rng-speed').oninput = (e) => {
      spinSpeed = parseFloat(e.target.value);
      document.getElementById('lbl-speed').textContent = `${spinSpeed.toFixed(1)}x`;
    };
    document.getElementById('rng-steer').oninput = (e) => {
      const deg = parseFloat(e.target.value);
      steerRad = THREE.MathUtils.degToRad(deg);
      document.getElementById('lbl-steer').textContent = `${deg}°`;
    };

    function setCam(pos, tgt) {
      camera.position.set(...pos);
      controls.target.set(...tgt);
      controls.update();
    }
    document.getElementById('cam-ext').onclick   = () => setCam([-4.0, 1.85, -4.4], [0, 0.78, 0]);
    document.getElementById('cam-side').onclick  = () => setCam([-3.4, 1.25,  0.1], [0, 0.85, 0.1]);
    document.getElementById('cam-wheel').onclick = () => setCam([-2.1, 0.55, -2.0], [-0.75, 0.33, -1.33]);
    document.getElementById('cam-int').onclick   = () => setCam([-0.36, 1.16, 0.35], [-0.30, 0.90, -1.20]);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      for (const d of Object.values(doorState)) {
        if (!d.node) continue;
        const target = d.open ? 1.05 : 0.0;
        d.cur = THREE.MathUtils.lerp(d.cur, target, Math.min(1, dt * 7.5));
        d.node.rotation.y = d.dir * d.cur;
      }

      if (spinOn && spinSpeed > 0) {
        const deltaSpin = dt * 3.8 * spinSpeed;
        for (const w of [parts.wFL, parts.wFR, parts.wRL, parts.wRR]) {
          if (w) w.rotation.x -= deltaSpin;
        }
      }
      if (parts.sFL) parts.sFL.rotation.y = steerRad;
      if (parts.sFR) parts.sFR.rotation.y = steerRad;
      if (parts.sw)  parts.sw.rotation.z  = steerRad * 4.5;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
