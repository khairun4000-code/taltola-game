<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tata 2515 Truck — High-Quality 3D Preview Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      overflow: hidden;
      user-select: none;
    }
    #canvas-wrap { position: fixed; inset: 0; }
    .panel {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 318px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
      z-index: 10;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
    }
    .panel h1 { font-size: 15px; font-weight: 800; color: #f8fafc; margin-bottom: 2px; }
    .panel .sub { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
    .section { border-top: 1px solid rgba(148, 163, 184, 0.16); padding-top: 10px; margin-top: 10px; }
    .label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 7px;
      display: flex; justify-content: space-between;
    }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    button {
      background: rgba(30, 41, 59, 0.92);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    button:hover { background: rgba(51, 65, 85, 0.96); border-color: #38bdf8; }
    button.active { background: #0284c7; border-color: #7dd3fc; color: #fff; }
    button.warn.active { background: #d97706; border-color: #fde047; color: #fff; }
    button.danger.active { background: #dc2626; border-color: #fca5a5; color: #fff; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; margin-top: 4px; }
    .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
    .swatch {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.45); cursor: pointer;
    }
    .swatch.active { border-color: #38bdf8; transform: scale(1.12); }
    .status-bar {
      position: fixed; bottom: 14px; right: 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px; padding: 8px 13px;
      font-size: 11.5px; color: #cbd5e1; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="panel">
    <h1>TATA LPT 2515 (10-Wheeler)</h1>
    <div class="sub">High-Quality Steel, Interior, Spinning Wheels, Doors &amp; Full Lighting</div>

    <div class="section">
      <div class="label">Camera Presets</div>
      <div class="btn-grid">
        <button data-cam="front34">Front 3/4</button>
        <button data-cam="rear34">Rear Trailer</button>
        <button data-cam="interior">Interior Cabin</button>
        <button data-cam="wheels">10-Wheel &amp; Steel</button>
        <button data-cam="side">Full Side View</button>
        <button data-cam="front">Front Grille/Lights</button>
      </div>
    </div>

    <div class="section">
      <div class="label">Cab Doors <span>[1 / 2 / O]</span></div>
      <div class="btn-grid-3">
        <button id="btn-door-fl">Left Door</button>
        <button id="btn-door-fr">Right Door</button>
        <button id="btn-door-all">All Doors</button>
      </div>
    </div>

    <div class="section">
      <div class="label">Lighting &amp; Indicators</div>
      <div class="btn-grid">
        <button id="btn-hl" class="active">Headlights</button>
        <button id="btn-hb">High Beam</button>
        <button id="btn-brk" class="danger">Brake Lights</button>
        <button id="btn-rev">Reverse Light</button>
        <button id="btn-ind-l" class="warn">◀ Left Ind</button>
        <button id="btn-ind-r" class="warn">Right Ind ▶</button>
        <button id="btn-haz" class="warn">⚠ Hazard</button>
        <button id="btn-night">🌙 Night Mode</button>
      </div>
    </div>

    <div class="section">
      <div class="label">Wheel Spin Speed <span id="spd-val">4.5 rad/s</span></div>
      <input id="wheel-speed" type="range" min="-10" max="14" step="0.5" value="4.5" />
      <div class="label" style="margin-top:8px;">Front Steering <span id="steer-val">0°</span></div>
      <input id="steer-angle" type="range" min="-28" max="28" step="1" value="0" />
    </div>

    <div class="section">
      <div class="label">Truck Paint Presets</div>
      <div class="swatches" id="paint-swatches">
        <div class="swatch active" style="background:#b91c1c" data-cab="#b91c1c" data-tr="#1e3a8a" title="BD Highway Red & Blue"></div>
        <div class="swatch" style="background:#15803d" data-cab="#15803d" data-tr="#eab308" title="BD Emerald Green & Gold"></div>
        <div class="swatch" style="background:#d97706" data-cab="#d97706" data-tr="#1e293b" title="Tata Saffron & Slate"></div>
        <div class="swatch" style="background:#0284c7" data-cab="#0284c7" data-tr="#e2e8f0" title="Highway Sky Blue & White"></div>
        <div class="swatch" style="background:#f8fafc" data-cab="#f8fafc" data-tr="#1e3a8a" title="Pearl White & Navy"></div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status-bar">Loading Tata 2515 High-Quality Studio...</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { loadHighQualityTata2515 } from './src/tata-2515-truck.js';

    const wrap = document.getElementById('canvas-wrap');
    const statusBar = document.getElementById('status-bar');

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x162235);
    scene.fog = new THREE.Fog(0x162235, 22, 62);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 140);
    camera.position.set(6.8, 3.2, 7.6);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.55, 0.2);
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.minDistance = 1.1;
    controls.maxDistance = 26;

    // Studio Lighting (Day / Night switchable)
    const hemi = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 1.05);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xfff7ed, 2.2);
    keyLight.position.set(9, 14, 10);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 40;
    const d = 8.5;
    keyLight.shadow.camera.left = -d;
    keyLight.shadow.camera.right = d;
    keyLight.shadow.camera.top = d;
    keyLight.shadow.camera.bottom = -d;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x93c5fd, 0.85);
    rimLight.position.set(-10, 7, -9);
    scene.add(rimLight);

    // Asphalt Showroom Floor
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(36, 64),
      new THREE.MeshStandardMaterial({ color: 0x1e2530, roughness: 0.72, metalness: 0.12 }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(32, 32, 0x334155, 0x1e293b);
    grid.position.y = 0.005;
    scene.add(grid);

    let truck = null;
    const doorTargets = { fl: 0, fr: 0 };
    const doorCur = { fl: 0, fr: 0 };
    const lightState = {
      headlights: true,
      highBeam: false,
      brake: false,
      reverse: false,
      indLeft: false,
      indRight: false,
      hazard: false,
      cabinLight: true,
    };
    let nightMode = false;
    let wheelSpeed = 4.5;
    let steerDeg = 0;
    let wheelAngle = 0;

    loadHighQualityTata2515('./assets/tata_2515.glb')
      .then((api) => {
        truck = api;
        scene.add(truck.root);
        statusBar.textContent = 'Tata 2515 Ready · Drag to orbit · Scroll to zoom · Use panel to test doors, lights & 10 spinning wheels';
      })
      .catch((err) => {
        statusBar.textContent = 'Error loading Tata 2515: ' + err.message;
        console.error(err);
      });

    // Camera presets
    const CAMS = {
      front34:  { pos: [ 6.8, 3.2,  7.6], tgt: [ 0.0, 1.55,  0.2] },
      rear34:   { pos: [-6.6, 3.2, -7.8], tgt: [ 0.0, 1.55, -0.6] },
      interior: { pos: [-0.25, 2.18, 2.72], tgt: [-0.55, 1.95, 3.85], openDoors: true },
      wheels:   { pos: [ 4.2, 1.05, -1.6], tgt: [ 0.8, 0.65, -1.7] },
      side:     { pos: [ 9.5, 2.2,  0.0], tgt: [ 0.0, 1.55,  0.0] },
      front:    { pos: [ 0.0, 1.9,  8.6], tgt: [ 0.0, 1.45,  3.5] },
    };
    document.querySelectorAll('[data-cam]').forEach((btn) => {
      btn.onclick = () => {
        const c = CAMS[btn.dataset.cam];
        if (!c) return;
        camera.position.set(...c.pos);
        controls.target.set(...c.tgt);
        controls.update();
        if (c.openDoors) {
          doorTargets.fl = -64;
          doorTargets.fr = 64;
          syncDoorButtons();
        }
      };
    });

    const btnFL = document.getElementById('btn-door-fl');
    const btnFR = document.getElementById('btn-door-fr');
    const btnAll = document.getElementById('btn-door-all');
    function syncDoorButtons() {
      btnFL.classList.toggle('active', doorTargets.fl !== 0);
      btnFR.classList.toggle('active', doorTargets.fr !== 0);
      btnAll.classList.toggle('active', doorTargets.fl !== 0 && doorTargets.fr !== 0);
    }
    btnFL.onclick = () => { doorTargets.fl = doorTargets.fl === 0 ? -64 : 0; syncDoorButtons(); };
    btnFR.onclick = () => { doorTargets.fr = doorTargets.fr === 0 ? 64 : 0; syncDoorButtons(); };
    btnAll.onclick = () => {
      const open = !(doorTargets.fl !== 0 && doorTargets.fr !== 0);
      doorTargets.fl = open ? -64 : 0;
      doorTargets.fr = open ? 64 : 0;
      syncDoorButtons();
    };

    const bindToggle = (id, key) => {
      const el = document.getElementById(id);
      el.onclick = () => {
        lightState[key] = !lightState[key];
        el.classList.toggle('active', lightState[key]);
      };
    };
    bindToggle('btn-hl', 'headlights');
    bindToggle('btn-hb', 'highBeam');
    bindToggle('btn-brk', 'brake');
    bindToggle('btn-rev', 'reverse');
    bindToggle('btn-ind-l', 'indLeft');
    bindToggle('btn-ind-r', 'indRight');
    bindToggle('btn-haz', 'hazard');

    const btnNight = document.getElementById('btn-night');
    btnNight.onclick = () => {
      nightMode = !nightMode;
      btnNight.classList.toggle('active', nightMode);
      const bg = nightMode ? 0x050912 : 0x162235;
      scene.background.setHex(bg);
      scene.fog.color.setHex(bg);
      hemi.intensity = nightMode ? 0.25 : 1.05;
      keyLight.intensity = nightMode ? 0.35 : 2.2;
      rimLight.intensity = nightMode ? 0.45 : 0.85;
    };

    const spdInput = document.getElementById('wheel-speed');
    const spdVal = document.getElementById('spd-val');
    spdInput.oninput = () => {
      wheelSpeed = Number(spdInput.value);
      spdVal.textContent = `${wheelSpeed.toFixed(1)} rad/s`;
    };
    const steerInput = document.getElementById('steer-angle');
    const steerVal = document.getElementById('steer-val');
    steerInput.oninput = () => {
      steerDeg = Number(steerInput.value);
      steerVal.textContent = `${steerDeg}°`;
    };

    document.querySelectorAll('.swatch').forEach((sw) => {
      sw.onclick = () => {
        document.querySelectorAll('.swatch').forEach((s) => s.classList.remove('active'));
        sw.classList.add('active');
        truck?.setCabPaint(sw.dataset.cab, sw.dataset.tr);
      };
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Digit1') btnFL.click();
      else if (e.code === 'Digit2') btnFR.click();
      else if (e.code === 'KeyO') btnAll.click();
    });

    const clock = new THREE.Clock();
    let elapsed = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;

      if (truck) {
        wheelAngle += wheelSpeed * dt;
        const w = truck.wheels;
        for (const wn of ['fl', 'fr', 'rl1', 'rr1', 'rl2', 'rr2']) {
          if (w[wn]) w[wn].rotation.x = wheelAngle;
        }
        const steerRad = THREE.MathUtils.degToRad(steerDeg);
        w.flSteer.rotation.y = steerRad;
        w.frSteer.rotation.y = steerRad;
        if (truck.steeringWheel) truck.steeringWheel.rotation.z = -steerRad * 4.5;

        const lerp = Math.min(1, dt * 6.5);
        doorCur.fl += (doorTargets.fl - doorCur.fl) * lerp;
        doorCur.fr += (doorTargets.fr - doorCur.fr) * lerp;
        truck.doors.fl.rotation.y = THREE.MathUtils.degToRad(doorCur.fl);
        truck.doors.fr.rotation.y = THREE.MathUtils.degToRad(doorCur.fr);

        const blinkOn = Math.floor(elapsed * 3.0) % 2 === 0;
        truck.applyLights({ ...lightState, blinkOn });
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
